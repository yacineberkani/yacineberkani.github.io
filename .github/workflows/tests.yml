# Tests unitaires à chaque push / pull request (gratuit pour un dépôt public).
name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests unitaires (rendu, validation du contenu, publication, client GitHub)
        run: npm test
